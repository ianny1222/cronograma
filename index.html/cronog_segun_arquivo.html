<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonStudy - Foco & Tempo</title>
    <style>
        /* Reutilizando as variáveis e estilos base do arquivo principal */
        :root {
            --bg-color: #121214;
            --card-bg: rgba(30, 30, 35, 0.6);
            --neon-pink: #ff007f;
            --neon-pink-glow: rgba(255, 0, 127, 0.4);
            --text-color: #e1e1e6;
            --text-muted: #8d8d99;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: radial-gradient(circle at 20% 20%, #251020 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink-glow);
        }

        nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: all 0.3s;
        }
        .tab-btn:hover, .tab-btn.active {
            color: #fff;
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink-glow);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto 25px auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        /* Relógio Digital */
        .clock-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-pink-glow);
            margin: 20px 0;
            font-family: monospace;
        }

        /* Controles do Cronômetro */
        .timer-settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        input[type="number"] {
            width: 80px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
        }

        .btn-control {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-control:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>

    <header>
        <h1>NeonStudy</h1>
    </header>

    <nav>
        <a href="index.html" class="tab-btn">📊 Voltar para o Cronograma</a>
        <a href="#relogio" class="tab-btn active">⏱️ Central de Tempo</a>
    </nav>

    <section class="glass-panel" id="relogio">
        <h2>🕒 Horário Atual</h2>
        <div class="clock-display" id="liveClock">00:00:00</div>
    </section>

    <section class="glass-panel">
        <h2>⏱️ Cronômetro de Foco (Máx 60 min)</h2>
        <div class="timer-settings">
            <label for="minutesInput">Minutos:</label>
            <input type="number" id="minutesInput" min="1" max="60" value="25">
        </div>
        <div class="clock-display" id="timerDisplay">25:00</div>
        
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button class="btn-control" id="startBtn">Iniciar</button>
            <button class="btn-control" id="resetBtn" style="border-color: var(--text-muted);">Resetar</button>
        </div>
    </section>

    <script>
        // --- LÓGICA DO RELÓGIO EM TEMPO REAL ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR');
            document.getElementById('liveClock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- LÓGICA DO CRONÔMETRO REGRESSIVO (MÁX 60 MIN) ---
        let countdown;
        let timeLeft;
        const timerDisplay = document.getElementById('timerDisplay');
        const minutesInput = document.getElementById('minutesInput');
        const startBtn = document.getElementById('startBtn');

        // Limita o input dinamicamente a 60 minutos
        minutesInput.addEventListener('input', function() {
            if (this.value > 60) this.value = 60;
            if (this.value < 1) this.value = 1;
            timerDisplay.textContent = `${String(this.value).padStart(2, '0')}:00`;
        });

        function startTimer() {
            clearInterval(countdown);
            
            const minutes = parseInt(minutesInput.value);
            timeLeft = minutes * 60;

            countdown = setInterval(() => {
                const minutesLeft = Math.floor(timeLeft / 60);
                const secondsLeft = timeLeft % 60;

                timerDisplay.textContent = `${String(minutesLeft).padStart(2, '0')}:${String(secondsLeft).padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "Tempo Esgotado!";
                    alert("🚨 Alarme! Hora de fazer uma pausa nos estudos.");
                }

                timeLeft--;
            }, 1000);
        }

        startBtn.addEventListener('click', startTimer);
        document.getElementById('resetBtn').addEventListener('click', () => {
            clearInterval(countdown);
            timerDisplay.textContent = `${String(minutesInput.value).padStart(2, '0')}:00`;
        });
    </script>
</body>
</html>
<script src="assets/js/timer.js"></script>
